# 双仓部署：内容仓推送 -> 本仓库重新构建 -> 发布到 GitHub Pages。
#
# 由 .github/workflows/deploy.yml.example 启用而来，已按 GitHub Pages 变体配置：
#   - 构建全部在 Actions 里完成（本仓库 checkout 主题 + 用 token checkout 私有内容仓）；
#   - 产物 dist/ 通过 actions/deploy-pages 发布，无需任何服务器。
#
# 前置条件（见 docs/content-separation/dual-repo-ci.md）：
#   1. 代码仓 Settings -> Pages -> Build and deployment -> Source 选 "GitHub Actions"；
#   2. 代码仓 Secrets 配置 CONTENT_REPO_TOKEN（对内容仓仅有 Contents: Read 权限的 PAT）；
#   3. 内容仓启用 trigger-build.yml 并配置 DISPATCH_TOKEN。
#
# 站点地址：https://jinTai-GitHub.github.io/Shirone/
# 注意：项目页部署在子路径下，内容仓 config/site.yaml 的 base 必须是 "/Shirone/"。

name: Deploy

on:
  # 代码变更。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  # 内容仓推送后由 trigger-build.yml 发来的事件。
  repository_dispatch:
    types: [content-updated]
  # 手动触发；回滚时把 content_ref 填成旧的内容 SHA。
  workflow_dispatch:
    inputs:
      content_ref:
        description: "内容仓 ref 或 commit SHA（留空使用 main）"
        required: false
        default: ""
  # 兜底：repository_dispatch 事件偶尔会丢，每天重建一次保证最终一致。
  schedule:
    - cron: "17 4 * * *"

# 并发控制：同一时间只允许一个部署流水线运行。
# 无论是代码仓代码推送（push）还是内容仓触发（repository_dispatch），
# 均归入同一个 deploy 并发通道。新的构建请求会自动取消正在运行中的旧构建，
# 确保始终以最新一次提交（最新代码 + 最新内容）为准，杜绝并发竞争。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  # GitHub Pages 发布所需的额外权限。
  pages: write
  id-token: write

env:
  # 私有内容仓；由下面的 checkout 步骤用 CONTENT_REPO_TOKEN 拉取。
  CONTENT_REPOSITORY: jinTai-GitHub/my-blog-content
  CONTENT_WORKING_COPY: .content-src

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions/deploy-pages 要求声明 github-pages 环境，用于记录发布地址。
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      CI: true
      # 让 content:sync 走「本地目录」模式，内容由下面的 checkout 步骤取得。
      CONTENT_DIR: .content-src

    steps:
      - name: Resolve content ref
        id: target
        # 经 env 传递而不是直接内插到脚本里：client_payload 属于外部输入，
        # 直接内插会形成 shell 注入面。
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 先自检再 checkout：把「secret 没配」和「token 没权限」这两种失败区分开，
      # 并直接打印 GitHub API 的返回码，省去翻日志猜原因。
      - name: Verify content repository access
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          REPO: ${{ env.CONTENT_REPOSITORY }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CONTENT_REPO_TOKEN 为空。请在【代码仓】Settings -> Secrets and variables -> Actions 中新建名为 CONTENT_REPO_TOKEN 的 secret（注意不要加到内容仓）。"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO")
          echo "GET /repos/$REPO -> HTTP $code"
          case "$code" in
            200) echo "✓ token 可以读取 $REPO" ;;
            401) echo "::error::token 无效或已过期（HTTP 401）。请重新生成 PAT 并更新 secret。"; exit 1 ;;
            403) echo "::error::token 被拒绝（HTTP 403）。可能是 token 权限不足或被组织策略限制。"; exit 1 ;;
            404) echo "::error::token 看不到 $REPO（HTTP 404）。最常见原因：fine-grained token 的 Repository access 没有勾选 my-blog-content，或权限里 Contents 未设为 Read。"; exit 1 ;;
            *)   echo "::error::读取 $REPO 失败（HTTP $code）。"; exit 1 ;;
          esac

      - name: Checkout content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          # 内容仓是私有的，必须带 token；公开仓可删掉这一行。
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: |
          set -euo pipefail
          echo "sha=$(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # 缩略图按源图内容哈希复用，跨 commit 的缓存命中安全且有效；
          # 内容层存储（.astro / node_modules/.astro）不跨 commit 缓存，避免集合清空后旧条目残留。
          path: |
            public/assets/moments/thumbnails
          key: ${{ runner.os }}-shirone-thumbnails-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-thumbnails-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 独立成步，而不是依赖 `pnpm build` 内部再跑一次：
      # 内容问题（含 config/*.yaml 的类型校验）与构建问题因此在日志里天然分开，
      # 且 fonts:subset 需要内容与配置都已就位。
      - name: Materialize content and config
        run: pnpm content:sync

      # 番剧数据与封面：缓存 + 按需刷新。
      # 未配置 provider 时，anime:sync 会自动跳过并 exit 0，对未启用番剧的站点零影响。
      - name: Restore anime cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            src/data/anime-snapshots
            public/assets/anime/covers
          key: ${{ runner.os }}-shirone-anime-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-anime-

      - name: Sync anime data (best effort)
        run: pnpm anime:sync --if-stale
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Build site
        run: pnpm build
        env:
          # 按需补齐可选功能的凭据。
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      # ── 发布到 GitHub Pages（无需服务器）────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- 内容仓：\`${CONTENT_REPOSITORY}\`"
            echo "- 内容 ref：\`${{ steps.target.outputs.ref }}\`"
            echo "- 内容 commit：\`${{ steps.content.outputs.sha }}\`"
            echo "- 站点地址：\`${{ steps.pages.outputs.page_url }}\`"
            if [ -f content.lock.json ]; then
              echo ""
              echo "<details><summary>content.lock.json</summary>"
              echo ""
              echo '```json'
              cat content.lock.json
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
